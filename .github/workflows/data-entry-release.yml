name: Data-entry release

on:
  push:
    tags:
      - 'data-entry/v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing data-entry/vX.Y.Z tag to publish'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: data-entry-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select release tag
        id: select
        env:
          EVENT_NAME: ${{ github.event_name }}
          REQUESTED_TAG: ${{ inputs.tag }}
          PUSHED_TAG: ${{ github.ref_name }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "tag=$REQUESTED_TAG" >> "$GITHUB_OUTPUT"
          else
            echo "tag=$PUSHED_TAG" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate and package data-entry
        if: steps.select.outputs.tag != ''
        env:
          RELEASE_TAG: ${{ steps.select.outputs.tag }}
        run: |
          python3 .github/scripts/validate_data_entry_update_policy.py
          if [[ ! "$RELEASE_TAG" =~ ^data-entry/v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Invalid release tag: $RELEASE_TAG" >&2
            exit 1
          fi
          git fetch --no-tags origin \
            '+refs/heads/master:refs/remotes/origin/master' \
            "+refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          if ! git merge-base --is-ancestor "$RELEASE_TAG^{commit}" origin/master; then
            echo "Release tag commit is not contained in origin/master." >&2
            exit 1
          fi
          python3 .github/scripts/build_data_entry_release.py \
            --tag "$RELEASE_TAG" \
            --output "dist/data-entry-${RELEASE_TAG#data-entry/}.zip"

      - name: Publish GitHub Release
        if: steps.select.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.select.outputs.tag }}
        run: |
          gh release create "$RELEASE_TAG" \
            "dist/data-entry-${RELEASE_TAG#data-entry/}.zip" \
            --verify-tag \
            --latest=false \
            --title "Data-entry ${RELEASE_TAG#data-entry/v}" \
            --notes-from-tag
